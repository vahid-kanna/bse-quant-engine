name: Placement Audit & Engine Verification

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Independent Metric Verification Harness
        run: |
          python verify_metrics.py

      - name: Run Event-Driven Engine Architecture Demo
        run: |
          python run_backtest_demo.py
